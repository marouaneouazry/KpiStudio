<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Mantis KPI Studio</title>

  <!-- External Fonts & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 24px;
      transition: var(--transition);
    }

    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
    }

    .login-icon-badge {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    .login-header h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      color: var(--text-main);
    }

    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
      margin: 0;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 18px;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-subtle);
      color: var(--text-main);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
      transition: var(--transition);
    }

    .input-wrapper input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
      background: var(--surface);
      color: var(--text-main);
    }

    .login-alert {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      align-items: center;
      gap: 8px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger-text);
    }

    .login-alert i {
      font-size: 18px;
    }

    .theme-toggle-login {
      position: absolute;
      top: 20px;
      right: 20px;
    }
  </style>
</head>

<body>

  <button class="theme-toggle theme-toggle-login" id="theme-toggle" title="Basculer le mode sombre">
    <i class="ti ti-moon" id="theme-icon"></i>
  </button>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <i class="ti ti-info-circle"></i>
    <span id="toast-msg"></span>
  </div>

  <div class="login-card">
    <div class="login-header">
      <div class="login-icon-badge">
        <i class="ti ti-lock"></i>
      </div>
      <div>
        <h1>Mantis KPI Studio</h1>
        <p>Connectez-vous avec votre compte LDAP d'entreprise</p>
      </div>
    </div>

    <div class="login-alert" id="login-alert">
      <i class="ti ti-alert-triangle"></i>
      <span id="alert-msg">Identifiant ou mot de passe incorrect.</span>
    </div>

    <form class="login-form" id="login-form">
      <div class="field-group">
        <label for="username">Identifiant (LDAP / AD)</label>
        <div class="input-wrapper">
          <i class="ti ti-user"></i>
          <input type="text" id="username" placeholder="ex: jdupont" required autofocus autocomplete="username" />
        </div>
      </div>

      <div class="field-group">
        <label for="password">Mot de passe</label>
        <div class="input-wrapper">
          <i class="ti ti-key"></i>
          <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password" />
        </div>
      </div>

      <button type="submit" class="btn btn-main" id="btn-login" style="margin-top: 8px;">
        <i class="ti ti-login"></i> Se connecter
      </button>
    </form>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
